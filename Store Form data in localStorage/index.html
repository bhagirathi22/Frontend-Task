<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Persistent Form</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #172033;
			background: #eef3f8;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			padding: 2rem 1rem;
			place-items: center;
		}

		main {
			width: min(100%, 480px);
			padding: 2rem;
			border: 1px solid #d7e0ea;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 12px 30px rgb(23 32 51 / 10%);
		}

		h1 {
			margin: 0 0 0.4rem;
		}

		.intro,
		#status {
			color: #617087;
		}

		.intro {
			margin-top: 0;
		}

		form {
			display: grid;
			gap: 1rem;
			margin-top: 1.5rem;
		}

		label {
			display: grid;
			gap: 0.4rem;
			font-weight: 700;
		}

		input,
		textarea,
		select,
		button {
			padding: 0.7rem;
			border-radius: 4px;
			font: inherit;
		}

		input,
		textarea,
		select {
			border: 1px solid #aebccc;
		}

		textarea {
			min-height: 120px;
			resize: vertical;
		}

		.actions {
			display: flex;
			gap: 0.75rem;
		}

		button {
			cursor: pointer;
			border: 0;
			font-weight: 700;
		}

		#save-button {
			color: #ffffff;
			background: #1769aa;
		}

		#clear-button {
			color: #a32828;
			background: #fff0f0;
		}

		#status {
			min-height: 1.25rem;
			margin-bottom: 0;
		}
	</style>
</head>
<body>
	<main>
		<h1>Contact form</h1>
		<p class="intro">Your progress is saved automatically in this browser.</p>

		<form id="contact-form">
			<label>
				Name
				<input name="name" type="text" autocomplete="name" required>
			</label>

			<label>
				Email
				<input name="email" type="email" autocomplete="email" required>
			</label>

			<label>
				Topic
				<select name="topic">
					<option value="general">General question</option>
					<option value="feedback">Feedback</option>
					<option value="support">Support</option>
				</select>
			</label>

			<label>
				Message
				<textarea name="message" required></textarea>
			</label>

			<div class="actions">
				<button id="save-button" type="submit">Save form</button>
				<button id="clear-button" type="button">Clear saved data</button>
			</div>
		</form>

		<p id="status" role="status" aria-live="polite"></p>
	</main>

	<script>
		function persistForm(form, storageKey) {
			const fields = Array.from(form.elements).filter((field) => field.name);

			function readForm() {
				return fields.reduce((data, field) => {
					if (field.type === 'checkbox') {
						data[field.name] = field.checked;
					} else if (field.type === 'radio') {
						if (field.checked) data[field.name] = field.value;
					} else {
						data[field.name] = field.value;
					}
					return data;
				}, {});
			}

			function restoreForm() {
				const savedData = localStorage.getItem(storageKey);
				if (!savedData) return false;

				try {
					const data = JSON.parse(savedData);
					fields.forEach((field) => {
						if (!(field.name in data)) return;
						if (field.type === 'checkbox') {
							field.checked = data[field.name];
						} else if (field.type !== 'radio' || field.value === data[field.name]) {
							field.value = data[field.name];
						}
					});
					return true;
				} catch {
					localStorage.removeItem(storageKey);
					return false;
				}
			}

			function saveForm() {
				localStorage.setItem(storageKey, JSON.stringify(readForm()));
			}

			fields.forEach((field) => field.addEventListener('input', saveForm));
			fields.forEach((field) => field.addEventListener('change', saveForm));
			restoreForm();

			return {
				save: saveForm,
				clear() {
					localStorage.removeItem(storageKey);
					form.reset();
				}
			};
		}

		const form = document.querySelector('#contact-form');
		const status = document.querySelector('#status');
		const savedForm = persistForm(form, 'contact-form-data');

		if (localStorage.getItem('contact-form-data')) {
			status.textContent = 'Saved form data restored.';
		}

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			savedForm.save();
			status.textContent = 'Form data saved in this browser.';
		});

		document.querySelector('#clear-button').addEventListener('click', () => {
			savedForm.clear();
			status.textContent = 'Saved form data cleared.';
		});
	</script>
</body>
</html>
