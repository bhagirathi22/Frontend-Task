<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Password Toggle</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Arial, sans-serif;
			color: #172033;
			background: #eef3f8;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
		}

		form {
			width: min(90%, 360px);
			padding: 2rem;
			border: 1px solid #d7e0ea;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 12px 30px rgb(23 32 51 / 10%);
		}

		h1 {
			margin-top: 0;
			font-size: 1.5rem;
		}

		label {
			display: block;
			margin-bottom: 0.5rem;
			font-weight: 700;
		}

		.password-row {
			display: flex;
			gap: 0.5rem;
		}

		input {
			box-sizing: border-box;
			min-width: 0;
			flex: 1;
			padding: 0.7rem;
			border: 1px solid #aebccc;
			border-radius: 4px;
			font: inherit;
		}

		button {
			cursor: pointer;
			padding: 0.7rem 0.9rem;
			border: 0;
			border-radius: 4px;
			font: inherit;
			font-weight: 700;
		}

		#toggle-password {
			color: #172033;
			background: #dce8f5;
		}

	 [type="submit"] {
			width: 100%;
			margin-top: 1rem;
			color: #ffffff;
			background: #1769aa;
		}

		#form-message {
			min-height: 1.25rem;
			margin: 1rem 0 0;
			color: #1769aa;
		}
	</style>
</head>
<body>
	<form id="password-form">
		<h1>Enter your password</h1>
		<label for="password">Password</label>
		<!-- <div class="password-row"> -->
			<input id="password" name="password" type="password" autocomplete="current-password" required>
			<button id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
		<!-- </div> -->
		<button type="submit">Submit</button>
		<p id="form-message" role="status" aria-live="polite"></p>
	</form>

	<script>
		const passwordInput = document.querySelector('#password');
		const toggleButton = document.querySelector('#toggle-password');
		const passwordForm = document.querySelector('#password-form');
		const formMessage = document.querySelector('#form-message');

		toggleButton.addEventListener('click', () => {
			const isVisible = passwordInput.type === 'text';

			passwordInput.type = isVisible ? 'password' : 'text';
			toggleButton.textContent = isVisible ? 'Show' : 'Hide';
			toggleButton.setAttribute('aria-pressed', String(!isVisible));
		});

		passwordForm.addEventListener('submit', (event) => {
			event.preventDefault();
			formMessage.textContent = 'Password accepted.';
		});
	</script>
</body>
</html>
